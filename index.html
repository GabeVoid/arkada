<!DOCTYPE html>
<html lang="pt-BR" data-color-theme="mint">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const scheme = localStorage.getItem("color-scheme") ?? "light dark";
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = scheme;
        const prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = scheme === "dark" || (scheme === "light dark" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        const colorTheme = localStorage.getItem("arkada_color_theme") || "mint";
        document.documentElement.dataset.colorTheme = colorTheme;
      } catch {
        // Storage unavailable
      }
    </script>
    <meta name="description" content="Arkada — Acompanhamento e rotina de higiene bucal" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Arkada</title>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-teal-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
